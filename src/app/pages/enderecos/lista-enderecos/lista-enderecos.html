@if(buscas.length > 0) {
<section aria-labelledby="search-list-title" class="address-list">
    <div class="address-list__header">
        <div class="address-list__title"><span class="material-icons" aria-hidden="true">history</span><h2 id="search-list-title">Histórico de buscas</h2></div>
        <button (click)="excluirTodosEvent.emit()" class="address-list__clear-button" matButton="outlined" type="button"
            aria-label="Excluir todas as buscas">
            <mat-icon aria-hidden="true">delete_outline</mat-icon>Limpar histórico</button>
    </div>
    <table aria-label="Lista de endereços pesquisados" class="address-list__table">
        <thead>
            <tr>
                <th scope="col">CEP</th>
                <th scope="col">Endereço</th>
                <th scope="col">Consultado em</th>
                <th scope="col">

                </th>
            </tr>
        </thead>
        <tbody>
            @for(busca of buscas; track $index; let indice = $index){
            <tr>
                <td data-label="CEP">{{ busca.cep }}</td>
                <td data-label="Endereço">
                    <span class="address-list__address">
                        {{ busca.endereco }}
                        <a [href]="'https://www.google.com/maps/search/?api=1&query=' + busca.endereco">
                            <mat-icon>
                                place
                            </mat-icon>
                        </a>
                    </span>

                </td>
                <td data-label="Data">{{ busca.data }}</td>
                <td data-label="Ações">
                    <button class="address-list__delete-button" matIconButton type="button"
                        [attr.aria-label]="'Excluir busca do CEP ' + busca.cep" (click)="buscaExcluida.emit(indice)">
                        <mat-icon aria-hidden="true">close</mat-icon>
                    </button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</section>
}
